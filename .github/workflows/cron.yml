name: AI News Auto Collect

on:
  schedule:
    - cron: '0 19 * * 1,4'  # 日本時間 火・金 04:00
  workflow_dispatch:  # 手動実行も可能にする

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger news collection
        run: |
          curl -X POST ${{ secrets.APP_URL }}/api/collect \
            -H "Content-Type: application/json"
